<!doctype html><meta charset="utf-8"><title>Feudalism original runtime probe</title><style>body{font:15px system-ui;background:#eef2ee;color:#24322d;margin:20px}#player{width:800px;height:600px}textarea{width:95%;height:180px}button{padding:12px;margin:8px}#status{font-weight:bold}</style><h1>Original SWF runtime probe</h1><p>Ruffle 0.7.1 · instrumented research copy · original class/timeline code retained</p><button id="start">Run 300-frame trace</button><button id="stop">Suspend</button><button id="export">Export trace</button><span id="status">Ready</span><div id="player"></div><textarea id="trace" readonly aria-label="Runtime trace"></textarea><script src="../runtime/package/ruffle.js"></script><script>
let player,api,lines=[];const status=document.querySelector('#status'),trace=document.querySelector('#trace');document.querySelector('#start').onclick=async()=>{lines=[];trace.value='';document.querySelector('#player').replaceChildren();player=window.RufflePlayer.newest().createPlayer();player.style.width='800px';player.style.height='600px';document.querySelector('#player').append(player);api=player.ruffle();const observe=message=>{lines.push(message);trace.value=lines.join('\n');if(message.startsWith('FRAME|'))status.textContent=message;if(message.startsWith('DONE|')){status.textContent='Complete: '+message;setTimeout(()=>api.suspend(),0);}};api.traceObserver=observe;status.textContent='Loading original runtime';let probeHeartbeat=setInterval(()=>{if(api&&lines.length===0)status.textContent='Loading state '+api.readyState+' · playing '+!api.suspended;},1000);try{await api.load({url:'./instrumented.swf?probe='+Date.now(),autoplay:'on',allowScriptAccess:false,logLevel:'warn',splashScreen:false});api.traceObserver=observe;api.volume=0;api.resume();clearInterval(probeHeartbeat);status.textContent+=' · loaded';}catch(e){status.textContent='Error: '+e.message;}};document.querySelector('#stop').onclick=()=>{api?.suspend();status.textContent+=' · suspended';};document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({runtime:'Ruffle 0.7.1',lines},null,2)],{type:'application/json'}));a.download='feudalism-original-trace.json';a.click();};
</script>
