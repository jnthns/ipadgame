name: Mechanics checks
on:
  push:
    branches: [main, mechanics-first, device-test-stage]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: feudalism-mechanics-test-build
          path: dist
          retention-days: 14
